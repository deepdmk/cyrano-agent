name: CyranoChat
options:
  bundleIdPrefix: com.cyrano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.5.0"
targets:
  CyranoChat:
    type: application
    platform: iOS
    attributes:
      DevelopmentTeam: W7C9Y763AX
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: false
    sources:
      - path: Sources
        excludes:
          - Info.plist
    resources:
      - path: Resources
    dependencies:
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W7C9Y763AX
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: CyranoChat needs microphone access for voice conversations.
        NSSpeechRecognitionUsageDescription: CyranoChat uses speech recognition to convert your voice to text.
        NSLocalNetworkUsageDescription: CyranoChat connects to a nearby Cyrano Server for AI processing.
        NSBonjourServices:
          - _cyrano-chat._tcp
    preBuildScripts:
      - name: Check Models
        script: |
          if [ ! -f "${SRCROOT}/Models/PocketTTS/model.safetensors" ]; then
            echo "warning: Pocket TTS models not found. Run Scripts/download_models.sh or copy from unamentis."
          fi
          if [ ! -d "${SRCROOT}/Models/GLM-ASR/GLMASRWhisperEncoder.mlmodelc" ]; then
            echo "warning: GLM-ASR models not found. Run Scripts/download_models.sh or copy from unamentis."
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy Models to Bundle
        script: |
          MODELS_SRC="${SRCROOT}/Models"
          MODELS_DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models"
          mkdir -p "${MODELS_DST}/PocketTTS/voices"
          mkdir -p "${MODELS_DST}/GLM-ASR"
          # Copy PocketTTS models
          if [ -f "${MODELS_SRC}/PocketTTS/model.safetensors" ]; then
            rsync -a "${MODELS_SRC}/PocketTTS/" "${MODELS_DST}/PocketTTS/"
            echo "Copied PocketTTS models to bundle"
          fi
          # Copy GLM-ASR models
          if [ -d "${MODELS_SRC}/GLM-ASR/GLMASRWhisperEncoder.mlmodelc" ]; then
            rsync -a "${MODELS_SRC}/GLM-ASR/" "${MODELS_DST}/GLM-ASR/"
            echo "Copied GLM-ASR models to bundle"
          fi
        basedOnDependencyAnalysis: false
  CyranoChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CyranoChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat.tests
        GENERATE_INFOPLIST_FILE: true
