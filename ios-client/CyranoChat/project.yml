name: CyranoChat
options:
  bundleIdPrefix: com.cyrano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.5.0"
targets:
  CyranoChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    resources:
      - path: Resources
      - path: Models
        optional: true
        buildPhase: resources
    dependencies:
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: CyranoChat needs microphone access for voice conversations.
        NSSpeechRecognitionUsageDescription: CyranoChat uses speech recognition to convert your voice to text.
        NSLocalNetworkUsageDescription: CyranoChat connects to a nearby Cyrano Server for AI processing.
        NSBonjourServices:
          - _cyrano-chat._tcp
    preBuildScripts:
      - name: Check Models
        script: |
          if [ ! -f "${SRCROOT}/Models/PocketTTS/model.safetensors" ]; then
            echo "warning: Pocket TTS models not found. Run Scripts/download_models.sh or copy from unamentis."
          fi
          if [ ! -d "${SRCROOT}/Models/GLM-ASR/GLMASRWhisperEncoder.mlmodelc" ]; then
            echo "warning: GLM-ASR models not found. Run Scripts/download_models.sh or copy from unamentis."
          fi
        basedOnDependencyAnalysis: false
  CyranoChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CyranoChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat.tests
        GENERATE_INFOPLIST_FILE: true
