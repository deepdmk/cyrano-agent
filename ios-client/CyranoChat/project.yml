name: CyranoChat
options:
  bundleIdPrefix: com.cyrano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.5.0"
targets:
  CyranoChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - package: swift-log
        product: Logging
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Sources/Info.plist
  CyranoChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CyranoChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrano.chat.tests
        GENERATE_INFOPLIST_FILE: true
